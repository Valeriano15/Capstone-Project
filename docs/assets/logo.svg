<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-Assisted Pentest and Reporting">
  <title>AI-Assisted Pentest and Reporting</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Shield mark -->
  <g transform="translate(20,20)">
    <path d="M80 4 L146 28 V86 C146 128 116 152 80 164 C44 152 14 128 14 86 V28 Z"
          fill="url(#shield)"/>
    <path d="M80 4 L146 28 V86 C146 128 116 152 80 164 C44 152 14 128 14 86 V28 Z"
          fill="none" stroke="#0f172a" stroke-width="3" stroke-opacity="0.25"/>
    <!-- Terminal prompt + AI node -->
    <path d="M48 66 L68 84 L48 102" fill="none" stroke="#0f172a" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    <line x1="76" y1="104" x2="112" y2="104" stroke="#0f172a" stroke-width="7"
          stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="108" cy="52" r="10" fill="#0f172a" fill-opacity="0.85"/>
    <circle cx="108" cy="52" r="4" fill="#2dd4bf"/>
    <line x1="108" y1="52" x2="88" y2="78" stroke="#0f172a" stroke-width="3"
          stroke-opacity="0.5"/>
    <circle cx="88" cy="78" r="4" fill="#0f172a" fill-opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(210,0)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="86" font-size="40" font-weight="700" fill="#0ea5e9">AI-Assisted</text>
    <text x="0" y="128" font-size="34" font-weight="600" fill="#334155" class="wordmark-sub">Pentest &amp; Reporting</text>
    <text x="2" y="162" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1.5">METASPLOIT  |  CYB 691 CAPSTONE</text>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      .wordmark-sub { fill: #cbd5e1; }
    }
  </style>
</svg>
